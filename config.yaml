# ---------------- What to search ----------------
search:
  keywords:                 # one search per keyword on each platform
    - sales coordinator
    - sales executive
    - inside sales
    - business development executive
  location: Bengaluru
  max_age_hours: 24         # only jobs posted within this window
  pages: 2                  # result pages per keyword

platforms: [linkedin, naukri]
linkedin:
  easy_apply_only: true     # external-apply jobs are skipped

# ---------------- Mode ----------------
# dry-run: search, filter, score, tailor, walk the LinkedIn form up to the last step, then discard. Nothing is submitted.
# live:    actually submits applications.
mode: dry-run

active_hours: [8, 22]       # bot does nothing outside these hours (24h clock), unless run with --force

# ---------------- Hard filters (checked before spending any Claude time) ----------------
filters:
  title_include_any: [sales, business development, presales, pre-sales, account, coordinator, customer success, relationship]
  title_exclude: [intern, trainee, director, vp, "vice president", head, "senior manager", "general manager"]
  company_blacklist: []

# ---------------- Scoring (Claude rates fit 0-100) ----------------
scoring:
  min_score: 70
  max_description_chars: 6000
  notes: ""                 # e.g. "Prefer junior roles in Bengaluru; no field-sales roles"

# ---------------- Limits (be gentle with the sites) ----------------
limits:
  max_applications_per_run: 15
  max_applications_per_day: 40
  delay_seconds: [5, 11]    # random pause between jobs

# ---------------- Resume ----------------
resume:
  master_dir: resume
  tex_file: resume.tex
  compile_cmd: [tectonic, resume.tex]
  output_name: Shradha_Biradar_Resume.pdf   # file name recruiters see on LinkedIn
  on_tailor_failure: use_master             # use_master | skip
  # Tailored output is rejected unless all of these strings are still present, unchanged:
  protected_strings:
    - Shradha Biradar
    - shradhabiradar258@gmail.com
    - "+91 9380704215"
    - BESCOM
    - East West Institute of Technology
    - Shaheen PU College
    - Shivaji High School
    - TAP Academy

claude:
  cmd: claude
  model: null               # e.g. sonnet, to pick a specific model

# ---------------- Answers for LinkedIn screening questions ----------------
# The bot only fills a question when 'match' (a regex on the question text) matches AND 'value' is set.
# Anything it has no answer for makes it skip that job and log it. Fill in YOUR real values.
answers: []
#  - match: "years of experience"
#    value: ""
#  - match: "notice period"
#    value: ""
#  - match: "current ctc|current salary"
#    value: ""
#  - match: "expected ctc|expected salary"
#    value: ""
