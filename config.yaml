# Shared settings. Everything profile-specific (search, filters, scoring min_score/notes, answers,
# resume output_name / protected_strings / on_tailor_failure, optional limits) lives in
# resume/<profile>/profile.yaml and is deep-merged over this file.

platforms: [linkedin, naukri]
linkedin:
  easy_apply_only: true     # external-apply jobs are skipped

# ---------------- Mode ----------------
# dry-run: search, filter, score, tailor, walk the LinkedIn form up to the last step, then discard. Nothing is submitted.
# live:    actually submits applications.
mode: dry-run

active_hours: [8, 22]       # bot does nothing outside these hours (24h clock), unless run with --force

# ---------------- Scoring defaults (profiles override min_score) ----------------
scoring:
  min_score: 70
  max_description_chars: 6000

# ---------------- Limits (be gentle with the sites; profiles may override) ----------------
limits:
  max_applications_per_run: 15
  max_applications_per_day: 40
  delay_seconds: [5, 11]    # random pause between jobs

# ---------------- Resume toolchain ----------------
resume:
  tex_file: resume.tex
  compile_cmd: [tectonic, resume.tex]

# ---------------- LLM backend (scoring + resume tailoring) ----------------
llm:
  provider: cursor          # cursor | claude
  cmd: cursor-agent         # for provider claude: claude
  model: claude-sonnet-5-5-medium
  timeout_seconds: 300
